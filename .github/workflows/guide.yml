name: Price guide
on:
  workflow_dispatch: {}   # run by hand any time to refresh the price guide without using eBay calls
permissions:
  contents: write
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Price guide (PriceCharting)
        run: python pc_prices.py
      - name: Save
        run: |
          git config user.name "price-guide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add guide.json
          git commit -m "Price guide $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
