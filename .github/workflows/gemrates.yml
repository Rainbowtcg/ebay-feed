name: Gem rates
on:
  schedule:
    - cron: "11 15 * * 6"   # Sunday about 2:11 am AEDT: weekly gem-rate list from PriceCharting population pages
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: feed-data          # never at the same time as the eBay feed or the shop scan
  cancel-in-progress: false
jobs:
  gemrates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read population pages and prices (PriceCharting)
        run: python gemrates.py
      - name: Save results
        run: |
          git config user.name "ebay-feed-bot"
          git config user.email "ebay-feed-bot@users.noreply.github.com"
          git add gemrates.json gemrates.md
          git diff --cached --quiet || git commit -m "Gem rates $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
