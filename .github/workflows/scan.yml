name: eBay feed
on:
  schedule:
    - cron: "17 19 * * *"   # 6:17 am AEDT daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python ebay_search.py
      - name: Read shop catalogues
        continue-on-error: true
        run: python store_scan.py
      - name: Save results
        run: |
          git config user.name "ebay-feed-bot"
          git config user.email "ebay-feed-bot@users.noreply.github.com"
          git add listings.json listings.csv stores.json 2>/dev/null || git add listings.json listings.csv
          git diff --cached --quiet || git commit -m "eBay feed $(date -u +%F)"
          git push
