name: eBay feed
on:
  schedule:
    # GitHub starts scheduled runs about 8 h late. Several start times are listed so the first one GitHub actually
    # runs lands in the early morning (Sydney); the "gate" job below makes every later one skip itself
    # (listings.json under 16 h old), so there's still only one eBay search a day.
    - cron: "17 9 * * *"    # 8:17 pm Sydney (AEDT) -> usually starts ~4 am
    - cron: "17 10 * * *"   # 9:17 pm
    - cron: "17 11 * * *"   # 10:17 pm
    - cron: "17 17 * * *"   # 4:17 am: last fallback
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write             # phone alerts are posted as a GitHub issue
concurrency:
  group: feed-data          # shared with the afternoon shop scan, so the two never write the feed at the same time
  cancel-in-progress: false
jobs:
  gate:
    # GitHub starts scheduled runs many hours late (often 8+). The run is normally started on time by a Claude
    # scheduled task through workflow_dispatch; the cron below is only a fallback, so a late scheduled run is
    # skipped when an on-time run already did the job.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            listings.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timezone
          if os.environ.get("EV") != "schedule":
              print("go=true"); raise SystemExit
          try:
              g = json.load(open("listings.json", encoding="utf-8")).get("generated", "")
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(str(g).replace("Z", "+00:00"))).total_seconds() / 3600
          except Exception:
              age = 999
          print("go=" + ("false" if age < 16 else "true"))
          EOF
        env:
          EV: ${{ github.event_name }}
  scan:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity (for the saves made partway through the search)
        run: |
          git config user.name "ebay-feed-bot"
          git config user.email "ebay-feed-bot@users.noreply.github.com"
      - name: Search eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          CHECKPOINT_PUSH: "1"   # push results every 60 searches, so a dropped GitHub machine doesn't lose the whole day
        run: python ebay_search.py
      - name: Read shop catalogues
        continue-on-error: true
        run: python store_scan.py
      - name: Refresh card values (PriceCharting)
        continue-on-error: true
        run: python values_refresh.py
      - name: Add values for unvalued cards (PriceCharting)
        continue-on-error: true
        timeout-minutes: 25
        run: python values_grow.py
      - name: Price shop cards (Mega Cash)
        continue-on-error: true
        run: python megacash_prices.py
      - name: Categories, price history and daily summary
        continue-on-error: true
        run: python enrich.py
      - name: Phone alerts for new deals
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_ISSUE: "1"
        run: python alerts.py
      - name: Price guide (PriceCharting)
        continue-on-error: true
        run: python pc_prices.py
      - name: Search report (which searches find nothing)
        continue-on-error: true
        run: python query_report.py
      - name: Build finder feed
        continue-on-error: true
        run: python build_feed.py listings.json feed.js - stores.json
      - name: Save results
        run: |
          git config user.name "ebay-feed-bot"
          git config user.email "ebay-feed-bot@users.noreply.github.com"
          git add listings.json listings.csv
          for f in stores.json feed.js feed-lite.js history.json digest.json digest.md guide.json megacash.json megacash.md mc_cache.json values.json values_check.md values_suspect.json values_grow.json values_grow.md query_history.json queries_report.md alerts_seen.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "eBay feed $(date -u +%F)"
          # if a file was uploaded while this ran, put the results on top of it instead of failing (a failed push throws away the whole day's eBay calls)
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
      - name: Refresh the finder's copy
        continue-on-error: true
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed.js" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed-lite.js" || true
      - name: Check the eBay search ran
        # turns the run red (and GitHub emails you) when eBay searches didn't run, so stale data can't pass as fresh
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("listings.json", encoding="utf-8"))
          done, _, total = str(d.get("searches_done", "")).partition("/")
          done, total = int(done or 0), int(total or 0)
          bad = d.get("bad_lines") or []
          fail = []
          if d.get("calls") == 0 or done == 0:
              fail.append(f"eBay search did not run (0 of {total} searches): every eBay listing is carried over from an earlier day")
          elif total and done < total / 2:
              fail.append(f"eBay search stopped early: only {done} of {total} searches ran")
          elif total and done < total:
              print(f"::warning::eBay search incomplete: {done} of {total} searches ran; the rest kept earlier results")
          if bad:
              fail.append(f"eBay rejected {len(bad)} search line(s) in queries.txt: " + " | ".join(bad[:5]))
          for m in fail:
              print(f"::error::{m}")
          sys.exit(1 if fail else 0)
          EOF
