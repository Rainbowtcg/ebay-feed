name: eBay feed
on:
  schedule:
    - cron: "17 17 * * *"   # 4:17 am AEDT daily (3:17 am AEST in winter); GitHub usually starts it 1-2 h late, so it is done by about 7 am
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python ebay_search.py
      - name: Read shop catalogues
        continue-on-error: true
        run: python store_scan.py
      - name: Refresh card values (PriceCharting)
        continue-on-error: true
        run: python values_refresh.py
      - name: Price shop cards (Mega Cash)
        continue-on-error: true
        run: python megacash_prices.py
      - name: Categories, price history and daily summary
        continue-on-error: true
        run: python enrich.py
      - name: Price guide (PriceCharting)
        continue-on-error: true
        run: python pc_prices.py
      - name: Search report (which searches find nothing)
        continue-on-error: true
        run: python query_report.py
      - name: Build finder feed
        continue-on-error: true
        run: python build_feed.py listings.json feed.js - stores.json
      - name: Save results
        run: |
          git config user.name "ebay-feed-bot"
          git config user.email "ebay-feed-bot@users.noreply.github.com"
          git add listings.json listings.csv
          for f in stores.json feed.js feed-lite.js history.json digest.json digest.md guide.json megacash.json megacash.md mc_cache.json values.json values_check.md values_suspect.json query_history.json queries_report.md; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "eBay feed $(date -u +%F)"
          git push
      - name: Refresh the finder's copy
        continue-on-error: true
        run: curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed.js" || true
