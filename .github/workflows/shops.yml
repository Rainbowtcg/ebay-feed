name: Shop scan
on:
  schedule:
    - cron: "43 4 * * *"    # about 3:43 pm AEDT (2:43 pm AEST in winter): a second daily look at the shops, which sell out fast
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write             # phone alerts are posted as a GitHub issue
concurrency:
  group: feed-data          # shared with the morning eBay feed, so the two never write the feed at the same time
  cancel-in-progress: false
jobs:
  shops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read shop catalogues
        run: python store_scan.py
      - name: Price shop cards (Mega Cash)
        continue-on-error: true
        run: python megacash_prices.py
      - name: Categories, price history and daily summary
        continue-on-error: true
        run: python enrich.py
      - name: Phone alerts for new deals
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_ISSUE: "1"
        run: python alerts.py
      - name: Build finder feed
        continue-on-error: true
        run: python build_feed.py listings.json feed.js - stores.json
      - name: Save results
        run: |
          git config user.name "ebay-feed-bot"
          git config user.email "ebay-feed-bot@users.noreply.github.com"
          for f in stores.json feed.js feed-lite.js history.json digest.json digest.md megacash.json megacash.md mc_cache.json alerts_seen.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Shop scan $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
      - name: Refresh the finder's copy
        continue-on-error: true
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed.js" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed-lite.js" || true
